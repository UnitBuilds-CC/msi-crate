[package]
name = "velocity-msi"
version = "0.1.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Clean-room MSI (Windows Installer) package generator with a from-scratch OLE V3 compound file writer. No external OLE dependencies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/UnitBuilds-CC/msi-crate"
keywords = ["msi", "windows-installer", "ole", "compound-file", "installer"]
categories = ["encoding", "filesystem"]
readme = "README.md"

[dependencies]
# Timestamps
chrono = "0.4"

# Error handling
thiserror = "1.0"

# OLE compound file generation (custom implementation - no external dependencies)
uuid = "1.0"

# Cabinet compression (for MSZIP/deflate)
flate2 = "1.0"

[dev-dependencies]
tempfile = "3.10"
cfb = "0.14"
uuid = "1.0"
msi = "0.7"
cab = "0.4"
